# Python environment for the backend services (and the analysis scripts next to them).
# Portable: no build strings or prefix, so it builds with Miniconda or Miniforge on any
# Linux machine. setup.sh creates it with: conda env create -f backend/environment.yml
name: stefan
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - bcrypt==5.0.0
      - blinker==1.9.0
      - cffi==2.1.0
      - click==8.4.2
      - contourpy==1.3.3
      - cryptography==49.0.0
      - cycler==0.12.1
      - et-xmlfile==2.0.0
      - flask==3.1.3
      - fonttools==4.61.1
      - future==1.0.0
      - greenlet==3.3.2
      - iso8601==2.1.0
      - itsdangerous==2.2.0
      - jinja2==3.1.6
      - joblib==1.5.3
      - kiwisolver==1.4.9
      - markupsafe==3.0.3
      - matplotlib==3.10.8
      - numpy==2.4.3
      - openpyxl==3.1.5
      - pandas==3.0.1
      - paramiko==3.5.1
      - pillow==12.1.1
      - psycopg==3.2.10
      - psycopg-binary==3.2.10
      - psycopg2-binary==2.9.10
      - pycparser==3.0
      - pymodbus==3.15.0
      - pynacl==1.6.2
      - pyparsing==3.3.2
      - pyserial==3.5
      - python-dateutil==2.9.0.post0
      - python-dotenv==1.1.0
      - pyyaml==6.0.3
      - schedule==1.2.2
      - six==1.17.0
      - sqlalchemy==2.0.48
      - sshtunnel==0.4.0
      - typing-extensions==4.15.0
      - tzdata==2025.3
      - werkzeug==3.1.8
